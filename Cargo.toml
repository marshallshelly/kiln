[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
description = "Native desktop apps from real HTML, CSS and TypeScript, rendered without Chromium or a WebView"
license = "Apache-2.0"
repository = "https://github.com/marshallshelly/kiln"
readme = "README.md"
keywords = ["desktop", "gui", "html", "css", "renderer"]
categories = ["gui", "command-line-utilities"]

[dependencies]
accesskit = "0.24"
anyhow = "1.0.104"
anyrender = "0.11"
anyrender_vello = "0.12"
arboard = "3"
atomic_refcell = "0.1.14"
blitz-dom = { version = "0.3.0-beta.1", features = ["accessibility"] }
blitz-html = "0.3.0-beta.1"
blitz-paint = "0.3.0-beta.1"
blitz-traits = "0.3.0-beta.1"
cssparser = "0.37"
keyboard-types = "0.7"
muda = "0.19"
notify-rust = "4"
parley = { version = "0.10", features = ["complex-scripts"] }
png = "0.18.1"
rfd = "0.17"
rquickjs = { version = "0.12.2", features = ["macro", "futures", "loader"] }
serde_json = "1"
tray-icon = "0.24"
base64 = "0.22"
flate2 = "1"
minisign-verify = "0.2"
semver = "1"
tar = "0.4"
ureq = "3"
tungstenite = "0.30"
url = "2.5.8"
winit = "0.30.13"

[dev-dependencies]
minisign = "0.9"
