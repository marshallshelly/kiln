name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and lint are platform-independent, so run them once rather than
  # three times.
  lint:
    name: fmt + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # winit needs X11 and Wayland; muda, tray-icon and rfd need GTK and
      # libxdo. None of this is required to build on macOS or Windows.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            pkg-config

      - run: cargo build --locked --all-targets

      # No test paints, so none of them needs a GPU or a display. Tree
      # snapshots record box sizes and therefore only *compare* on macOS,
      # where they were blessed; every platform still runs the code that
      # produces them.
      - run: cargo test --locked

  # Every installer is built on the platform it targets and inspected there,
  # because an installer nobody opened is not evidence of anything.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config dpkg-dev

      # Pinned to v4. WiX v6 and later are gated behind the Open Source
      # Maintenance Fee EULA, which is a licensing decision for whoever runs
      # this, not something CI should accept silently. The .wxs targets the v4
      # schema in any case.
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 4.0.6

      - run: cargo build --release --locked

      # macOS: check the layout the OS requires, and that a linked stylesheet
      # travelled with the app.
      - name: Build a .app and .dmg
        if: runner.os == 'macOS'
        run: |
          ./target/release/kiln package examples/tailwind.html \
            --name "Kiln CI" --out dist --dmg
          test -f "dist/Kiln CI.app/Contents/MacOS/Kiln CI"
          test -f "dist/Kiln CI.app/Contents/Resources/app/index.html"
          test -f "dist/Kiln CI.app/Contents/Resources/app/vendor/tailwind.css"
          test -f "dist/Kiln CI.dmg"

      # Linux: build the package, then actually install it and run the
      # installed binary. dpkg-deb --contents alone would not catch a broken
      # symlink or a missing asset.
      - name: Build and install a .deb
        if: runner.os == 'Linux'
        run: |
          ./target/release/kiln package examples/tailwind.html \
            --name "Kiln CI" --out dist --deb
          deb=$(ls dist/*.deb)
          dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          test -L /usr/bin/kiln-ci
          test -f /usr/lib/kiln-ci/app/index.html
          test -f /usr/lib/kiln-ci/app/vendor/tailwind.css
          test -f /usr/share/applications/kiln-ci.desktop
          kiln-ci check /usr/lib/kiln-ci/app/index.html
          sudo dpkg -r kiln-ci

          # Same guard as Windows: a .deb that lists cleanly but ships nothing
          # would still install without error.
          size=$(stat -c %s "$deb")
          echo "$deb is $size bytes"
          test "$size" -gt 1000000

      # Windows: build the installer, then confirm the payload runs.
      - name: Build an .msi
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./target/release/kiln.exe package examples/tailwind.html \
            --name "KilnCI" --out dist --msi
          ls -la dist
          test -f "dist/KilnCI/KilnCI.exe"
          test -f "dist/KilnCI/app/index.html"
          test -f "dist/KilnCI/app/vendor/tailwind.css"
          ./dist/KilnCI/KilnCI.exe check dist/KilnCI/app/index.html

          # An .msi that built is not an .msi that contains anything. The
          # payload is a ~30 MB binary, so anything under a megabyte is an
          # empty installer that would pass a mere existence check.
          msi=$(ls dist/*.msi)
          size=$(stat -c %s "$msi" 2>/dev/null || stat -f %z "$msi")
          echo "$msi is $size bytes"
          test "$size" -gt 1000000
          cat dist/*.wxs | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-${{ runner.os }}-installer
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.msi
          if-no-files-found: error
