name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and lint are platform-independent, so run them once rather than
  # three times.
  lint:
    name: fmt + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # winit needs X11 and Wayland; muda, tray-icon and rfd need GTK and
      # libxdo. None of this is required to build on macOS or Windows.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            pkg-config

      - run: cargo build --locked --all-targets

      # No test paints, so none of them needs a GPU or a display. Tree
      # snapshots record box sizes and therefore only *compare* on macOS,
      # where they were blessed; every platform still runs the code that
      # produces them.
      - run: cargo test --locked

  package:
    name: package (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      # Prove the shipped artefact is real: bundle it, then check the layout
      # macOS requires and that a linked stylesheet travelled with the app.
      - name: Build a .app
        run: |
          ./target/release/kiln package examples/tailwind.html \
            --name "Kiln CI" --out dist --dmg
          test -f "dist/Kiln CI.app/Contents/MacOS/Kiln CI"
          test -f "dist/Kiln CI.app/Contents/Resources/app/index.html"
          test -f "dist/Kiln CI.app/Contents/Resources/app/vendor/tailwind.css"
          test -f "dist/Kiln CI.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
